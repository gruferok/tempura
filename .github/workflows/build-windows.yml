name: Build Windows EXE

on:
  push:
    branches:
      - "arena/8d78a2be-tempura"
      - "main"
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies (no PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyinstaller

      - name: Run unit tests
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: pytest -q

      - name: Build EXE with PyInstaller
        run: pyinstaller --noconfirm --clean tempura.spec

      - name: Smoke test built EXE
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        shell: pwsh
        run: |
          $exe = "dist/TempuraRhythmLab/TempuraRhythmLab.exe"
          if (!(Test-Path $exe)) { Write-Error "EXE not found at $exe"; exit 1 }
          & $exe --diagnose
          if ($LASTEXITCODE -ne 0) { Write-Error "--diagnose failed ($LASTEXITCODE)"; exit $LASTEXITCODE }
          & $exe --headless-smoke
          if ($LASTEXITCODE -ne 0) { Write-Error "--headless-smoke failed ($LASTEXITCODE)"; exit $LASTEXITCODE }

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: TempuraRhythmLab-Windows-x64
          path: dist/TempuraRhythmLab/
          if-no-files-found: error
