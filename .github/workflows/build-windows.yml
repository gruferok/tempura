name: Build Windows EXE

on:
  push:
    branches:
      - "arena/8d78a2be-tempura"
      - "main"
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies (no PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest "pyinstaller>=6,<7"

      - name: Run unit tests
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: pytest -q

      - name: Build EXE with PyInstaller
        run: pyinstaller --noconfirm --clean tempura.spec

      - name: Verify torch is absent from the bundle and sources are packaged
        shell: pwsh
        run: |
          $bundle = "dist/TempuraRhythmLab"
          if (!(Test-Path $bundle)) { Write-Error "bundle folder $bundle not found"; exit 1 }
          if (!(Test-Path "src/__init__.py")) { Write-Error "src/__init__.py missing: collect_submodules would be empty"; exit 1 }
          $bad = Get-ChildItem -Path $bundle -Recurse -Force |
            Where-Object { $_.Name -like "torch" -or $_.Name -like "torch*.dist-info" -or $_.Name -like "nvidia*" }
          if ($bad) { $bad | ForEach-Object { Write-Host "unexpected: $($_.FullName)" }; Write-Error "torch/CUDA found in bundle"; exit 1 }
          $size = (Get-ChildItem -Path $bundle -Recurse -File | Measure-Object -Property Length -Sum).Sum
          Write-Host ("Bundle size: {0:N1} MB" -f ($size / 1MB))

      - name: Smoke test built EXE - diagnose (from a foreign working directory)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "dist/TempuraRhythmLab/TempuraRhythmLab.exe"
          if (!(Test-Path $exe)) { Write-Error "EXE not found at $exe"; exit 1 }
          Push-Location $env:TEMP
          try {
            $out = & $exe --diagnose
            $code = $LASTEXITCODE
          } finally {
            Pop-Location
          }
          $out | Out-Host
          if ($code -ne 0) { Write-Error "--diagnose exited with $code"; exit $code }
          if (-not ($out | Select-String -Pattern '"frozen": true')) { Write-Error "--diagnose did not report frozen=true"; exit 1 }
          if (-not ($out | Select-String -Pattern '"torch": "absent')) { Write-Error "--diagnose did not report torch absent"; exit 1 }

      - name: Smoke test built EXE - headless render (from a foreign working directory)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "dist/TempuraRhythmLab/TempuraRhythmLab.exe"
          Push-Location $env:TEMP
          try {
            & $exe --headless-smoke
            $code = $LASTEXITCODE
          } finally {
            Pop-Location
          }
          if ($code -ne 0) { Write-Error "--headless-smoke exited with $code"; exit $code }

      - name: Archive build for upload
        shell: pwsh
        run: Compress-Archive -Path "dist/TempuraRhythmLab/*" -DestinationPath "TempuraRhythmLab-Windows-x64.zip"

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: TempuraRhythmLab-Windows-x64
          path: TempuraRhythmLab-Windows-x64.zip
          if-no-files-found: error
