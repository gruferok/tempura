name: Build Windows EXE

on:
  push:
    branches:
      - "arena/8d78a2be-tempura"
      - "main"
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies (no PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest "pyinstaller>=6,<7"

      - name: Run unit tests
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: pytest -q

      - name: Build EXE with PyInstaller
        run: pyinstaller --noconfirm --clean tempura.spec

      - name: Verify torch is absent from the bundle
        shell: pwsh
        run: |
          $internal = "dist/TempuraRhythmLab/_internal"
          if (!(Test-Path $internal)) { Write-Error "bundle folder $internal not found"; exit 1 }
          $torch = Get-ChildItem -Path $internal -Recurse -Directory -Filter "torch" -ErrorAction Stop
          if ($torch) { Write-Error "torch found in bundle: $($torch[0].FullName)"; exit 1 }
          $size = (Get-ChildItem -Path "dist/TempuraRhythmLab" -Recurse -File | Measure-Object -Property Length -Sum).Sum
          Write-Host ("Bundle size: {0:N1} MB" -f ($size / 1MB))

      - name: Smoke test built EXE from a foreign working directory
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "dist/TempuraRhythmLab/TempuraRhythmLab.exe"
          if (!(Test-Path $exe)) { Write-Error "EXE not found at $exe"; exit 1 }
          Push-Location $env:TEMP
          try {
            & $exe --diagnose
            if ($LASTEXITCODE -ne 0) { Write-Error "--diagnose failed ($LASTEXITCODE)"; exit $LASTEXITCODE }
            & $exe --headless-smoke
            if ($LASTEXITCODE -ne 0) { Write-Error "--headless-smoke failed ($LASTEXITCODE)"; exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }

      - name: Archive build for upload
        shell: pwsh
        run: Compress-Archive -Path "dist/TempuraRhythmLab/*" -DestinationPath "TempuraRhythmLab-Windows-x64.zip"

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: TempuraRhythmLab-Windows-x64
          path: TempuraRhythmLab-Windows-x64.zip
          if-no-files-found: error
